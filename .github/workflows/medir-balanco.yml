name: Medir (balanço e testes da auditoria)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Baixar os preços publicados dos EUA (só para escolher os 1.000 mais negociados)
        env:
          BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data
        run: |
          mkdir -p site/data
          C="curl -fsSL --retry 6 --retry-delay 10 --retry-all-errors"
          $C "$BASE/manifest.json" -o site/data/manifest.json
          for f in $(python3 -c "import json;print(' '.join(json.load(open('site/data/manifest.json'))['arquivosPrecos']))"); do $C "$BASE/$f" -o "site/data/$f"; done

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Balanços trimestrais da SEC (desde 2009)
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: |
          pip install -q -r coleta/requirements.txt numpy
          cd coleta && python balancos_sec.py ../site/data ../balancos_us.json --limite 1000 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Preços longos (Yahoo, desde 2009)
        run: cd coleta && python precos_longos.py ../balancos_us.json ../precos_longos.json | tail -3

      - name: Testar hipóteses C e D
        run: cd coleta && python testar_fundamentos.py ../balancos_us.json ../precos_longos.json --saida ../fundamentos_teste.json

      - name: Confirmação de D (registrada em docs/hipotese-deriva-confirmacao.md)
        run: cd coleta && python confirmar_deriva.py ../balancos_us.json ../precos_longos.json --saida ../deriva_confirmacao.json

      - name: Guardar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fundamentos
          path: |
            fundamentos_teste.json
            deriva_confirmacao.json
            balancos_us.json

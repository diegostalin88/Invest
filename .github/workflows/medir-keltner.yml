name: Medir estratégia Keltner

# TEMPORÁRIO (branch de trabalho): diagnóstico do indice.json publicado. Só leitura.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: indice.json publicado
        run: |
          B=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data
          for p in "" "/br"; do
            echo "===== mercado '$p'"
            curl -fsSL "$B$p/manifest.json" | python3 -c "import json,sys;m=json.load(sys.stdin);print({k:v for k,v in m.items() if k!='arquivosPrecos'})"
            curl -fsSL "$B$p/indice.json" | python3 -c "
          import json,sys
          j=json.load(sys.stdin)
          print('principal',j.get('principal'),'rendaFixa',j.get('rendaFixa'),'geradoEm',j.get('geradoEm'))
          for t,s in j['series'].items(): print(t,s['nome'],len(s['dates']),list(zip(s['dates'][-25:],s['close'][-25:])))
          " || echo "sem indice.json"
          done

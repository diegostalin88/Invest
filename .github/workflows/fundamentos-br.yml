name: "Fundamentos Brasil - hipótese C-BR"

# Só leitura: teste da carteira por lucro/preço e dividendos no Brasil (docs/hipotese-fundamentos-brasil.md).
# Não publica nada.
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-ouh2hk]
    paths: ["coleta/testar_fundamentos_br.py", ".github/workflows/fundamentos-br.yml"]

permissions:
  contents: read

jobs:
  c-br:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Dependências
        run: pip install -r coleta/requirements.txt

      - name: Testes (sem rede)
        run: python -m pytest -q coleta/tests/test_fundamentos_br.py

      - name: Teste C-BR
        run: python coleta/testar_fundamentos_br.py --saida fundamentos_br.json

      - name: Guardar o resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fundamentos-br
          path: fundamentos_br.json
          if-no-files-found: ignore

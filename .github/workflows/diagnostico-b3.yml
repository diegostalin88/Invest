name: Diagnóstico B3 (coletor no Brasil)

# Roda só quando disparado à mão. Faz pedidos de leitura à B3 a partir do coletor no Brasil
# e mostra as respostas, para achar o caminho certo do arquivo de aluguel.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: [self-hosted, brasil]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Boletim Diário (BDI)
        run: python3 coleta/diagnostico_bdi.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Testar endereços da B3
        if: false
        run: bash coleta/diagnostico_b3.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Ver o que a página da B3 chama (navegador sem tela)
        if: false
        run: |
          V="$HOME/pw-venv"
          [ -x "$V/bin/python" ] || python3 -m venv "$V"
          "$V/bin/pip" install -q playwright
          "$V/bin/python" -m playwright install --with-deps chromium > /dev/null
          "$V/bin/python" coleta/diagnostico_b3_navegador.py | tee -a "$GITHUB_STEP_SUMMARY"

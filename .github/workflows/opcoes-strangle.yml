name: "Opções - O7: strangle comprado com parte dos juros"

# Só leitura: hipótese O7 (docs/opcoes/hipotese-strangle.md) e sua auditoria adversarial
# (mesmo documento). Não publica nada.
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-ouh2hk]
    paths: ["opcoes/strangle.py", ".github/workflows/opcoes-strangle.yml"]

permissions:
  contents: read

jobs:
  o7:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Testes (sem rede)
        run: |
          pip install pytest==9.2.0
          python -m pytest -q opcoes/tests

      - name: Backtest
        working-directory: opcoes
        run: python strangle.py --sorteios 100 --anos 2018-2026 --saida ../opcoes_resultado

      - name: Guardar o resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opcoes-o7
          path: opcoes_resultado/
          if-no-files-found: ignore

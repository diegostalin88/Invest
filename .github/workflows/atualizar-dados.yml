name: Atualizar dados

on:
  # Agendamento desligado em 12/11/2026 a pedido do Diego: a coleta roda na VM Oracle (vm/coletar.sh).
  workflow_dispatch:
    inputs:
      ticker_limit:
        description: "Modo teste: processar só os N primeiros tickers (vazio = universo completo)"
        required: false
        default: ""
      somente_app:
        description: "Só republicar o app com os dados atuais (sem nova coleta)"
        type: boolean
        default: false

# Nenhuma permissão por padrão; cada job pede só o que precisa.
permissions: {}

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  coletar:
    name: Coletar dados e montar o site
    if: (github.event_name == 'workflow_dispatch' && !inputs.somente_app) || github.event.schedule == '30 22 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: coleta/requirements.txt

      - name: Instalar dependências
        run: pip install -r coleta/requirements.txt

      - name: Testes da coleta (sem rede)
        run: python -m pytest -q coleta/tests

      - name: Coletar preços e fundamentos
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          TICKER_LIMIT: ${{ inputs.ticker_limit }}
        run: python coleta/fetch_all.py --saida site/data

      - name: Montar o site (app + dados)
        run: |
          cp -r app/. site/
          touch site/.nojekyll
          {
            echo "### Arquivos publicados"
            echo '```'
            ls -la site site/data
            du -sh site/data
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Índices de referência (SPY e BOVA11) para comparar a estratégia congelada
        continue-on-error: true
        run: python coleta/indices.py site/data

      - name: Semana (os balanços da SEC são renovados uma vez por semana)
        id: semana
        run: echo "s=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Balanços da semana (cache)
        id: cache-bal
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: balancos-cache
          key: balancos-v2-${{ steps.semana.outputs.s }}
          restore-keys: balancos-v2-

      - name: Balanços trimestrais dos EUA (SEC, 1.000 mais negociados; uma vez por semana)
        if: steps.cache-bal.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 40
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: |
          mkdir -p balancos-cache
          cd coleta && python balancos_sec.py ../site/data ../balancos-cache/novo.json --limite 1000 | tail -2
          mv ../balancos-cache/novo.json ../balancos-cache/balancos_us.json

      - name: Balanços trimestrais do Brasil (CVM; uma vez por semana)
        if: steps.cache-bal.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 30
        run: |
          mkdir -p balancos-cache/br
          cp site/data/br/manifest.json balancos-cache/br/ 2>/dev/null || true
          for f in $(python3 -c "import json;print(' '.join(json.load(open('site/data/br/manifest.json'))['arquivosPrecos']))"); do cp "site/data/br/$f" balancos-cache/br/; done
          python coleta/balancos_cvm.py balancos-cache/br
          rm -f balancos-cache/br/precos_*.json

      - name: Guardar os balanços da semana
        if: steps.cache-bal.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: balancos-cache
          key: balancos-v2-${{ steps.semana.outputs.s }}

      - name: Histórico de balanços para o app
        continue-on-error: true
        run: |
          python coleta/balancos_app.py balancos-cache/balancos_us.json site/data
          if [ -f balancos-cache/br/balancos.json ] && [ -f site/data/br/manifest.json ]; then
            cp balancos-cache/br/balancos.json site/data/br/
            python3 -c "import json;p='site/data/br/manifest.json';m=json.load(open(p));m['arquivoBalancos']='balancos.json';json.dump(m,open(p,'w'),ensure_ascii=False,indent=2)"
          fi

      - name: Aluguel B3 baixado pelo coletor no Brasil (se houver)
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: b3-cache
          key: b3-aluguel-${{ github.run_id }}
          restore-keys: b3-aluguel-

      - name: Vendidos (aluguel B3 e short interest FINRA)
        continue-on-error: true
        run: python coleta/vendidos.py --saida site/data --b3-bruto b3-cache/aluguel_b3.json

      - name: Node (para o relatório)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cópia de segurança do diário de sinais
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: diario-cache
          key: diario-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: diario-

      - name: Diário de sinais e calibração anteriores (o publicado ou, se faltar, a cópia do cache)
        continue-on-error: true
        env:
          BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data
        run: python3 coleta/diario_anterior.py site/data "$BASE" diario-cache

      - name: Relatório automático (backtests do app num navegador invisível)
        continue-on-error: true
        timeout-minutes: 60
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium
          node coleta/gerar_relatorio.js site

      - name: Histórico diário de vendidos e da recalibração (só guarda; não muda a estratégia)
        continue-on-error: true
        env:
          BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data
        run: python3 coleta/historico.py site/data "$BASE" diario-cache b3-cache/aluguel_b3.json

      - name: Guardar o diário (cópia de segurança)
        if: always()
        continue-on-error: true
        run: |
          mkdir -p diario-cache/br
          for f in diario.json calibracao.json historico.json; do
            cp "site/data/$f" diario-cache/ 2>/dev/null || true
            cp "site/data/br/$f" diario-cache/br/ 2>/dev/null || true
          done

      - name: Enviar o diário para o cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: diario-cache
          key: diario-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  so-app:
    name: Republicar só o app (dados atuais)
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.somente_app)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Baixar os dados já publicados e montar o site
        env:
          BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data
        run: |
          baixar() {  # $1 = URL base, $2 = pasta de destino
            mkdir -p "$2"
            curl -fsSL "$1/manifest.json" -o "$2/manifest.json" || return 1
            for f in $(python3 -c "import json,sys;m=json.load(open(sys.argv[1]));print(' '.join(m['arquivosPrecos']+[m.get('arquivoFundamentos','fundamentos.json')]))" "$2/manifest.json"); do
              curl -fsSL "$1/$f" -o "$2/$f" || return 1
            done
            # Extras opcionais (relatório e vendidos): se não vierem, some do manifesto para o app não pedir
            python3 - "$1" "$2" <<'PY'
          import json, sys, subprocess, os
          base, pasta = sys.argv[1], sys.argv[2]
          caminho = os.path.join(pasta, 'manifest.json'); m = json.load(open(caminho))
          for chave in ('arquivoRelatorio', 'arquivoVendidos', 'arquivoDiario', 'arquivoCalibracao', 'arquivoIndice', 'arquivoBalancos'):
              nome = m.get(chave)
              if nome and subprocess.run(['curl', '-fsSL', f'{base}/{nome}', '-o', os.path.join(pasta, nome)]).returncode != 0:
                  m.pop(chave)
          json.dump(m, open(caminho, 'w'), indent=2)
          PY
          }
          baixar "$BASE" site/data
          # Brasil é opcional: se ainda não existir (ou falhar), publica só os EUA
          baixar "$BASE/br" site/data/br || { rm -rf site/data/br; echo "Brasil (IBOVESPA) ainda não publicado." >> "$GITHUB_STEP_SUMMARY"; }
          cp -r app/. site/
          echo "### App republicado com os dados de $(python3 -c "import json;print(json.load(open('site/data/manifest.json'))['ultimoPregao'])")" >> "$GITHUB_STEP_SUMMARY"

      - name: Python (para os vendidos)
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Índices de referência (SPY e BOVA11) para comparar a estratégia congelada
        continue-on-error: true
        run: pip install -q -r coleta/requirements.txt && python coleta/indices.py site/data

      - name: Aluguel B3 baixado pelo coletor no Brasil (se houver)
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: b3-cache
          key: b3-aluguel-${{ github.run_id }}
          restore-keys: b3-aluguel-

      - name: Vendidos (aluguel B3 e short interest FINRA)
        continue-on-error: true
        run: |
          pip install requests
          python coleta/vendidos.py --saida site/data --b3-bruto b3-cache/aluguel_b3.json

      - name: Node (para o relatório)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cópia de segurança do diário de sinais
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: diario-cache
          key: diario-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: diario-

      - name: Diário de sinais e calibração anteriores (o publicado ou, se faltar, a cópia do cache)
        continue-on-error: true
        env:
          BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data
        run: python3 coleta/diario_anterior.py site/data "$BASE" diario-cache

      - name: Relatório automático (backtests do app num navegador invisível)
        continue-on-error: true
        timeout-minutes: 60
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium
          node coleta/gerar_relatorio.js site

      - name: Histórico diário de vendidos e da recalibração (só guarda; não muda a estratégia)
        continue-on-error: true
        env:
          BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data
        run: python3 coleta/historico.py site/data "$BASE" diario-cache b3-cache/aluguel_b3.json

      - name: Guardar o diário (cópia de segurança)
        if: always()
        continue-on-error: true
        run: |
          mkdir -p diario-cache/br
          for f in diario.json calibracao.json historico.json; do
            cp "site/data/$f" diario-cache/ 2>/dev/null || true
            cp "site/data/br/$f" diario-cache/br/ 2>/dev/null || true
          done

      - name: Enviar o diário para o cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: diario-cache
          key: diario-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  publicar:
    name: Publicar no GitHub Pages
    needs: [coletar, so-app]
    if: always() && (needs.coletar.result == 'success' || needs.so-app.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4

  manter-ativo:
    name: Manter agendamento ativo
    if: github.event.schedule == '0 12 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Registrar data (só um arquivinho de texto; nunca os dados)
        run: |
          mkdir -p status
          date -u +"Última verificação automática: %Y-%m-%d %H:%M UTC" > status/ultima_execucao.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/ultima_execucao.txt
          git commit -m "Mantém o agendamento ativo ($(date -u +%Y-%m-%d))" || echo "Nada a commitar"
          git push

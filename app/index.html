<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invest</title>
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-192.png">
<style>
:root{--fundo:#0b1220;--cartao:#131c2e;--cartao2:#1a2540;--borda:rgba(148,163,184,.18);--txt:#e5e9f2;--mudo:#93a1b8;--acento:#4f8cff;--alta:#22c55e;--baixa:#f05252;--amarelo:#f5b301;--l1:#4f8cff;--l2:#22c55e;--l3:#f5b301;--l4:#c084fc;--l5:#93a1b8}
:root[data-tema="claro"]{--fundo:#f3f5f9;--cartao:#fff;--cartao2:#eef2f8;--borda:rgba(15,23,42,.12);--txt:#0f172a;--mudo:#5b6b82;--acento:#2563eb;--alta:#15803d;--baixa:#dc2626;--amarelo:#b45309;--l1:#2563eb;--l2:#15803d;--l3:#b45309;--l4:#9333ea;--l5:#64748b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fundo);color:var(--txt);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--fundo);padding:12px 16px 8px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--borda)}
header h1{font-size:20px;margin:0}
header small{color:var(--mudo);font-size:13px}
main{max-width:760px;margin:0 auto;padding:12px 16px}
.tela{display:none}.tela.ativa{display:block}
.cartao{background:var(--cartao);border:1px solid var(--borda);border-radius:16px;padding:16px;margin:0 0 12px}
.cartao h2{font-size:18px;margin:0 0 8px}
.mudo{color:var(--mudo)}.peq{font-size:14px}.mini{font-size:12.5px}
.grande{font-size:32px;font-weight:700;letter-spacing:-.5px}
.alta{color:var(--alta)}.baixa{color:var(--baixa)}.aviso{color:var(--amarelo)}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dado{background:var(--cartao2);border-radius:12px;padding:10px 12px}
.dado .r{font-size:13px;color:var(--mudo)}.dado .v{font-size:19px;font-weight:650}
.linha{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--borda);align-items:baseline}
.linha:first-child{border-top:0}
.linha .v{font-weight:600;text-align:right;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:7px 6px;text-align:right;border-top:1px solid var(--borda)}
th:first-child,td:first-child{text-align:left}
th{font-size:13px;color:var(--mudo);font-weight:600}
.rolar{overflow-x:auto;-webkit-overflow-scrolling:touch}
nav#barra{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--cartao);border-top:1px solid var(--borda);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav#barra button{flex:1;background:none;border:0;color:var(--mudo);padding:9px 2px 10px;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav#barra button span{font-size:22px;line-height:1}
nav#barra button.ativa{color:var(--acento);font-weight:650}
button,.botao{font:inherit}
.botao{display:inline-block;background:var(--acento);color:#fff;border:0;border-radius:12px;padding:11px 16px;font-weight:650;cursor:pointer;text-decoration:none;text-align:center}
.botao.sec{background:var(--cartao2);color:var(--txt);border:1px solid var(--borda)}
.botao.perigo{background:var(--baixa)}
.botao.cheio{width:100%}
.chip{display:inline-block;font-size:13px;padding:3px 10px;border-radius:999px;background:var(--cartao2);border:1px solid var(--borda)}
.chip.verde{color:var(--alta);border-color:var(--alta)}.chip.amarelo{color:var(--amarelo);border-color:var(--amarelo)}.chip.vermelho{color:var(--baixa);border-color:var(--baixa)}
.abas{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap}
.abas button{background:var(--cartao2);border:1px solid var(--borda);color:var(--txt);border-radius:999px;padding:6px 12px;font-size:14px}
.abas button.ativa{background:var(--acento);color:#fff;border-color:var(--acento)}
label{display:block;margin:0 0 10px}
label>span{display:block;font-size:14px;color:var(--mudo);margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;font-size:17px;color:var(--txt);background:var(--cartao2);border:1px solid var(--borda);border-radius:10px;padding:10px 12px}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.barra-meta{position:relative;height:10px;background:var(--cartao2);border-radius:6px;margin-top:6px}
.barra-meta>i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--acento)}
.barra-meta>b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--txt)}
.lanc{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--borda)}
.lanc:first-child{border-top:0}
.lanc .acoes{display:flex;gap:6px;flex-shrink:0}
.lanc .acoes button{background:var(--cartao2);border:1px solid var(--borda);color:var(--txt);border-radius:8px;padding:4px 9px;font-size:13px}
.legenda{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--mudo);margin-top:6px}
.legenda i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
svg text{fill:var(--mudo);font-size:11px}
details summary{cursor:pointer;color:var(--acento);font-size:15px}
.vazio{text-align:center;padding:28px 12px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--txt);color:var(--fundo);padding:10px 16px;border-radius:12px;font-size:15px;z-index:9;display:none;max-width:90vw}
@media (min-width:700px){.grade.tres{grid-template-columns:1fr 1fr 1fr}}
/* app único (fase 2) */
header{flex-wrap:wrap;gap:8px}
.topo-linha{display:flex;align-items:center;gap:8px;width:100%}
.topo-linha h1{flex:1}
#busca{flex:1;min-width:0;padding:8px 12px;font-size:16px}
.merc{display:flex;border:1px solid var(--borda);border-radius:999px;overflow:hidden;flex-shrink:0}
.merc button{background:none;border:0;color:var(--mudo);padding:6px 10px;font-size:14px}
.merc button.ativa{background:var(--acento);color:#fff}
.icone{background:var(--cartao2);border:1px solid var(--borda);color:var(--txt);border-radius:10px;padding:6px 10px;font-size:15px;flex-shrink:0}
#sub-carteira{display:none}
body[data-aba="carteira"] #sub-carteira{display:flex}
.carrossel{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.mini-card{flex:0 0 auto;min-width:96px;background:var(--cartao2);border:1px solid var(--borda);border-radius:12px;padding:8px 10px;color:var(--txt);display:flex;flex-direction:column;align-items:flex-start;gap:2px;font-size:14px;cursor:pointer}
.item-alerta{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--borda);color:var(--txt);padding:9px 0;font-size:15px;cursor:pointer}
.item-alerta:first-of-type{border-top:0}
.congelado{border-color:var(--mudo);background:repeating-linear-gradient(135deg,var(--cartao),var(--cartao) 12px,var(--cartao2) 12px,var(--cartao2) 24px)}
body.oculto .din{filter:blur(7px);user-select:none}
@media (min-width:1024px){
  nav#barra{top:0;bottom:0;right:auto;width:190px;flex-direction:column;border-top:0;border-right:1px solid var(--borda);padding-top:70px}
  nav#barra button{flex:0 0 auto;flex-direction:row;gap:10px;justify-content:flex-start;padding:12px 18px;font-size:16px}
  body{padding-bottom:0;padding-left:190px}
}
</style>
</head>
<body>
<header>
  <div class="topo-linha"><h1>Invest</h1><span class="chip" id="selo-dados">carregando…</span><div class="merc"><button data-merc="br">BR</button><button data-merc="us">EUA</button></div></div>
  <div class="topo-linha"><input id="busca" type="search" placeholder="Buscar papel" autocomplete="off" enterkeyhint="search" aria-label="Buscar papel"><button class="icone" id="btn-tema" aria-label="Trocar tema">☀︎</button><button class="icone" data-tela="mais" aria-label="Mais">☰</button></div>
  <small id="cab-data" class="mudo" style="width:100%">carregando…</small>
</header>
<main>
  <div class="abas" id="sub-carteira"><button data-tela="resumo">Posições e rentabilidade</button><button data-tela="lancar">Lançar e importar</button><button data-tela="carteira">Rebalancear</button><button data-tela="ir">Imposto</button></div>
  <section class="tela ativa" id="tela-inicio" data-aba="inicio"></section>
  <section class="tela" id="tela-mercado" data-aba="mercado"></section>
  <section class="tela" id="tela-lab" data-aba="lab"></section>
  <section class="tela" id="tela-ativo" data-aba="ativo"></section>
  <section class="tela" id="tela-resumo" data-aba="carteira"></section>
  <section class="tela" id="tela-lancar" data-aba="carteira"></section>
  <section class="tela" id="tela-carteira" data-aba="carteira"></section>
  <section class="tela" id="tela-ir" data-aba="carteira"></section>
  <section class="tela" id="tela-mais" data-aba="mais"></section>
</main>
<nav id="barra">
  <button class="ativa" data-aba="inicio"><span>🏠</span>Início</button>
  <button data-aba="mercado"><span>📊</span>Mercado</button>
  <button data-aba="carteira"><span>💼</span>Carteira</button>
  <button data-aba="lab"><span>🧪</span>Laboratório</button>
</nav>
<div class="toast" id="toast"></div>
<script src="motor-carteira.js"></script>
<script src="js/telas.js"></script>
<script>
'use strict';
const C = window.Carteira;
const CHAVE = 'invest-carteira-v2';
let DADOS = null, R = null, ESTADO = null, editando = null, abaGrafico = 'patrimonio', anoIR = null, filtroLanc = '';
let periodoSel = 'inicio', periodoDe = '', periodoAte = '';
try { const p = JSON.parse(localStorage.getItem('invest-periodo') || 'null'); if (p) { periodoSel = p.k || 'inicio'; periodoDe = p.de || ''; periodoAte = p.ate || ''; } } catch (e) { }

// ---------- estado salvo no aparelho ----------
const ACOMPANHAR_PADRAO = ['SLV', 'IONX', 'FXF', 'PLTR', 'QBTX', 'QPUX', 'QTUM'];
function padrao() { return { versao: 2, lancamentos: [], metas: { ...C.METAS_PADRAO }, tiposIR: {}, aporteAutomatico: true, proximoAporte: 0, acompanhar: ACOMPANHAR_PADRAO.slice(), contaPadrao: 'BR' }; }
function ler() { try { const v = JSON.parse(localStorage.getItem(CHAVE) || 'null'); if (!v || !Array.isArray(v.lancamentos)) return padrao(); const e = { ...padrao(), ...v }; e.metas = { ...C.METAS_PADRAO, ...v.metas }; if (!Array.isArray(e.acompanhar)) e.acompanhar = ACOMPANHAR_PADRAO.slice();
    // 08/11/2026: BDR deixou de ser tratado como ação (não tem a isenção de R$ 20 mil)
    if (!e.migBDR) { for (const [k, t] of Object.entries(e.tiposIR || {})) if (t === 'acao' && C.ehBDR(k)) e.tiposIR[k] = 'bdr'; e.migBDR = 1; }
    return e; } catch (e) { return padrao(); } }
function gravar() { try { localStorage.setItem(CHAVE, JSON.stringify(ESTADO)); return true; } catch (e) { toast('Não consegui salvar neste aparelho.'); return false; } }
const novoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

// ---------- formatação ----------
const nf = (v, c = 2) => Number(v).toLocaleString('pt-BR', { minimumFractionDigits: c, maximumFractionDigits: c });
const R$ = (v) => v === null || v === undefined || !isFinite(v) ? '—' : (v < 0 ? '−R$ ' : 'R$ ') + nf(Math.abs(v));
const US$ = (v) => v === null || v === undefined || !isFinite(v) ? '—' : (v < 0 ? '−US$ ' : 'US$ ') + nf(Math.abs(v));
const moedaDe = (conta) => conta === 'EUA' ? US$ : R$;
const pct = (v, c = 1) => v === null || v === undefined || !isFinite(v) ? '—' : (v > 0 ? '+' : v < 0 ? '−' : '') + nf(Math.abs(v * 100), c) + '%';
const cor = (v) => v === null || v === undefined ? '' : v >= 0 ? 'alta' : 'baixa';
const dBR = (d) => d ? d.slice(0, 10).split('-').reverse().join('/') : '—';
const qf = (v) => v === null || v === undefined ? '—' : Number(v).toLocaleString('pt-BR', { maximumFractionDigits: 8 });
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hojeISO = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
function toast(t) { const e = document.getElementById('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = 'none', Math.max(3200, String(t).length * 55)); }

// ---------- dados de mercado ----------
async function carregarDados() {
    try { const r = await fetch('data/carteira.json', { cache: 'no-cache' }); if (!r.ok) throw new Error(r.status); DADOS = await r.json(); }
    catch (e) { DADOS = { ativos: {}, cdi: { datas: [], acum: [] }, ipca: { meses: [], var: [] }, erro: String(e) }; }
}
function recalcular() { R = C.calcular(DADOS, ESTADO.lancamentos, { aporteAutomatico: ESTADO.aporteAutomatico, tiposIR: ESTADO.tiposIR, hoje: hojeISO() }); }
function desenharTudo() {
    recalcular();
    const ult = DADOS.ativos && DADOS.ativos.BOVA11 ? DADOS.ativos.BOVA11.datas.slice(-1)[0] : null;
    document.getElementById('cab-data').textContent = DADOS.erro ? 'sem dados de mercado (só os lançamentos)' : `preços até ${dBR(ult)} · IPCA até ${DADOS.ipca.meses.slice(-1)[0] ? DADOS.ipca.meses.slice(-1)[0].split('-').reverse().join('/') : '—'}`;
    telaResumo(); telaLancar(); telaCarteira(); telaIR(); telaMais(); desenharNovas();
}

// ---------- RESUMO ----------
function telaResumo() {
    const el = document.getElementById('tela-resumo');
    if (R.vazio) { el.innerHTML = `<div class="cartao vazio"><div class="grande">Comece pela carteira</div><p class="mudo">Lance seus aportes e compras com a data de cada um. O app calcula o patrimônio, a rentabilidade de verdade (sem inflar com aportes e vendas), descontada a inflação, e o imposto.</p><button class="botao" data-ir-tela="lancar">Fazer o primeiro lançamento</button> <a class="botao sec" href="ajuda.html#comecar">Como começar</a>${temCarteiraAntiga() ? `<p class="peq mt"><button class="botao sec" data-acao="importar-antiga">Trazer a carteira do app antigo</button></p>` : ''}</div>${cartaoAcompanhar()}`; return; }
    const M = R.metricas, T = M.total, ganho = R.patrimonio - R.aportado, ganhoReal = R.patrimonio - R.aportesCorrigidos;
    const card = (titulo, p, extra = '') => p ? `<div class="dado"><div class="r">${titulo}</div><div class="v ${cor(p.nominal)}">${pct(p.nominal)}</div><div class="mini mudo">real ${pct(p.real)} · CDI ${pct(p.cdi)}${extra}</div></div>` : `<div class="dado"><div class="r">${titulo}</div><div class="v mudo">—</div></div>`;
        const sc = R.semCompra && (R.semCompra.valor > 0.005 || R.semCompra.valorUSD > 0.005) ? R.semCompra : null;
    el.innerHTML = `
    ${sc ? `<div class="cartao" style="border-color:var(--baixa)"><b>⚠ Faltam compras de ${esc(sc.ativos.join(', '))}</b>${sc.faltam ? `<div class="peq" style="margin:6px 0 0">Quantidade vendida a mais do que foi comprado (provavelmente o que você já tinha antes do extrato):<br>${Object.entries(sc.faltam).map(([c, f]) => `<b>${esc(c)}</b>: ${qf(+f.qtd.toFixed(8))}, primeira venda em ${dBR(f.primeira)}`).join('<br>')}</div>` : ''}<p class="peq" style="margin:6px 0 0">Há vendas sem a compra lançada antes. Para não inflar a rentabilidade, o dinheiro dessas vendas entrou como aporte; para o lucro e o imposto ficarem certos, em Lançar escolha <b>Posição inicial</b> e informe a quantidade que você já tinha e o preço médio da declaração de IR, com data antes da primeira venda (ex.: 31/12/2024).</p></div>` : ''}
    <div class="cartao">
        <div class="mudo peq">Patrimônio hoje</div>
        <div class="grande">${R$(R.patrimonio)}</div>
        ${R.aportado >= 0 ? `<div class="linha"><span>Dinheiro que você colocou<br><span class="mini mudo">aportes − retiradas</span></span><span class="v">${R$(R.aportado)}</span></div>`
            : `<div class="linha"><span>Você já tirou mais do que colocou<br><span class="mini mudo">retiradas − aportes: o ganho já voltou para o seu bolso</span></span><span class="v">${R$(-R.aportado)}</span></div>`}
        <div class="linha"><span>Ganho em reais</span><span class="v ${cor(ganho)}">${R$(ganho)}</span></div>
        <div class="linha"><span>Ganho real em reais<br><span class="mini mudo">aportes corrigidos pelo IPCA até hoje</span></span><span class="v ${cor(ganhoReal)}">${R$(ganhoReal)}</span></div>
    </div>
    ${R.contas ? `<div class="cartao">
        <h2>Por conta</h2>
        <div class="linha"><span>Conta Brasil</span><span class="v">${R$(R.contas.BR.valor)}<br><span class="mini mudo">${R.patrimonio > 0 ? nf(R.contas.BR.valor / R.patrimonio * 100, 1) : 0}% do total</span></span></div>
        <div class="linha"><span>Conta EUA<br><span class="mini mudo">${US$(R.contas.EUA.valorUSD)}${R.contas.EUA.caixaUSD > 0.005 ? ` · caixa ${US$(R.contas.EUA.caixaUSD)}` : ''}</span></span><span class="v">${R$(R.contas.EUA.valor)}<br><span class="mini mudo">${R.patrimonio > 0 ? nf(R.contas.EUA.valor / R.patrimonio * 100, 1) : 0}% do total</span></span></div>
        <p class="mini mudo" style="margin:8px 0 0">A conta EUA é convertida pelo dólar PTAX de ${dBR(R.contas.ptaxData)}: ${R$(R.contas.ptax)}. A rentabilidade acima já soma as duas contas em reais, incluindo a variação do dólar.</p>
    </div>` : ''}
    ${cartaoPosicaoAtual()}
    <div class="cartao">
        <h2>Rentabilidade da carteira</h2>
        <div class="grade">
            ${card(`Desde o início (${dBR(T.de)})`, T, T.aa !== null ? `<br>${pct(T.aa)} ao ano · real ${pct(T.aaReal)} a.a.` : '')}
            ${card(`Em ${R.fim.slice(0, 4)}`, M.ano)}
            ${card('Últimos 12 meses', M.m12)}
            ${card('Neste mês', M.mes)}
        </div>
        <p class="mini mudo" style="margin:10px 0 0">Calculada pelo método de cotas, o mesmo dos fundos: aporte compra cotas e retirada vende cotas, então só a valorização dos investimentos mexe no resultado. ${R.ipcaEstimado ? `O IPCA de ${R.fim.slice(5, 7)}/${R.fim.slice(0, 4)} ainda não saiu; usei o último mês divulgado como estimativa.` : ''}</p>
    </div>
    <div class="cartao">
        <div class="abas" id="abas-grafico"><button data-graf="patrimonio" class="${abaGrafico === 'patrimonio' ? 'ativa' : ''}">Patrimônio</button><button data-graf="cota" class="${abaGrafico === 'cota' ? 'ativa' : ''}">Rentabilidade</button></div>
        <div id="grafico"></div>
    </div>
    <div class="cartao" id="cartao-comparacao">${cartaoComparacao()}</div>
    ${cartaoFicha()}
    <div class="cartao">
        <h2>Ano a ano</h2>
        <div class="rolar"><table><tr><th>Ano</th><th>Carteira</th><th>Real</th><th>CDI</th><th>IPCA</th><th>Referência</th></tr>
        ${M.porAno.map(a => `<tr><td>${a.ano}${a.parcial ? '*' : ''}</td><td class="${cor(a.nominal)}">${pct(a.nominal)}</td><td class="${cor(a.real)}">${pct(a.real)}</td><td>${pct(a.cdi)}</td><td>${pct(a.ipca)}</td><td>${pct(a.ref)}</td></tr>`).join('')}</table></div>
        <p class="mini mudo" style="margin:8px 0 0">* ano incompleto.</p>
    </div>
    ${R.avisos.length ? `<div class="cartao"><h2>⚠ Confira</h2>${R.avisos.map(a => `<p class="peq" style="margin:6px 0">${esc(a)}</p>`).join('')}</div>` : ''}
    ${cartaoAcompanhar()}`;
    desenharGrafico();
}
// ---------- COMPARAÇÃO NO PERÍODO ESCOLHIDO (e cada papel × o setor dele) ----------
const PERIODOS = [['semana', 'Semana'], ['mes', 'Mês'], ['3m', '3 meses'], ['6m', 'Semestre'], ['12m', '12 meses'], ['ano', 'No ano'], ['2a', '2 anos'], ['5a', '5 anos'], ['inicio', 'Desde o início'], ['datas', 'Escolher datas']];
function addMeses(d, n) { const [a, m, dd] = d.split('-').map(Number); const x = new Date(Date.UTC(a, m - 1 + n, 1)); const ult = new Date(Date.UTC(x.getUTCFullYear(), x.getUTCMonth() + 1, 0)).getUTCDate(); x.setUTCDate(Math.min(dd, ult)); return x.toISOString().slice(0, 10); }
function basePeriodo(k, fim) {

// Retirada: quanto há no caixa da conta na data escolhida (sem contar o próprio lançamento, se estiver editando).

function disponivelEm(data, conta) {
    const lancs = ESTADO.lancamentos.filter(x => x.id !== editando && x.data <= data);
    if (!lancs.length) return { caixa: 0, rf: 0 };
    const r = C.calcular(DADOS, lancs, { aporteAutomatico: ESTADO.aporteAutomatico, tiposIR: ESTADO.tiposIR, hoje: data });
    if (!r || r.vazio) return { caixa: 0, rf: 0 };
    const caixa = conta === 'EUA' ? (r.caixaUSD || 0) : (r.caixa || 0);
    const rf = conta === 'EUA' ? 0 : r.posicoes.filter(p => p.classe === 'rf').reduce((s, p) => s + p.valor, 0);
    return { caixa: Math.max(0, caixa), rf };
}
function atualizarDisponivel() {
    const box = document.getElementById('f-disp'); if (!box) return;
    const data = (document.getElementById('f-data') || {}).value || hojeISO();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(data)) { box.innerHTML = ''; return; }
    const conta = document.getElementById('tela-lancar').dataset.conta === 'EUA' ? 'EUA' : 'BR', fmt = moedaDe(conta);
    let d; try { d = disponivelEm(data, conta); } catch (e) { box.innerHTML = ''; return; }
    const valor = +((document.getElementById('f-valor') || {}).value || '').replace(',', '.') || 0;
    box.dataset.disp = d.caixa.toFixed(2);
    box.innerHTML = `<div class="r">Disponível para retirada em ${dBR(data)}${conta === 'EUA' ? ' (conta EUA)' : ''}</div>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="v">${fmt(d.caixa)}</span>${d.caixa > 0.005 ? `<button class="botao sec" data-acao="usar-disp" style="padding:6px 12px;font-size:14px">Usar este valor</button>` : ''}</div>
        ${valor > d.caixa + 0.005 ? `<div class="mini baixa">O valor passa do disponível em ${fmt(valor - d.caixa)}.</div>` : ''}
        ${d.rf > 0.005 ? `<div class="mini mudo">Há também ${R$(d.rf)} em renda fixa: para retirar esse dinheiro, lance antes um resgate.</div>` : d.caixa <= 0.005 ? `<div class="mini mudo">Não há dinheiro parado no caixa nessa data. Para retirar, lance antes a venda ou o resgate de onde o dinheiro saiu.</div>` : ''}`;

    if (x.tipo === 'posicao_inicial') return `${qf(x.qtd)} com preço médio ${(x.conta === 'EUA' ? US$ : R$)(+x.preco)} = custo ${(x.conta === 'EUA' ? US$ : R$)(x.qtd * x.preco)}`;
    if (x.tipo === 'compra' || x.tipo === 'venda') return `${qf(x.qtd)} × ${R$(+x.preco)} = ${R$(x.qtd * x.preco)}${+x.custos ? ` + custos ${R$(+x.custos)}` : ''}${sufixo}`;

function salvarLancamento() {

    if (campos.includes('qtd') && !(l.qtd > 0)) return erro.textContent = 'Informe a quantidade.';
    if (tipo === 'bonificacao' && !(l.preco >= 0)) l.preco = 0;
    if (campos.includes('preco') && tipo !== 'bonificacao' && !(l.preco > 0)) return erro.textContent = 'Informe o preço.';
    if (campos.includes('valor') && !(l.valor > 0)) return erro.textContent = 'Informe o valor.';

function montarAnalise() {
    if (!R || R.vazio) return null;
    const r2 = (v, k = 2) => (v === null || v === undefined || !isFinite(v)) ? null : +(+v).toFixed(k);
    const pc = (v) => r2(v === null || v === undefined ? null : v * 100, 2);
    const s = R.serie, n = s.datas.length - 1, ptax = C.criarPTAX(DADOS);
    const lancamentos = C.normalizar(ESTADO.lancamentos).map(l => {
        const cp = CAMPOS[l.tipo] || [], tem = (k) => cp.includes(k) ? (l[k] ?? null) : null, eua = l.conta === 'EUA';
        const bruto = cp.includes('valor') ? (+l.valor || 0) : (+l.qtd || 0) * (+l.preco || 0), fx = eua ? (ptax(l.data) || null) : 1;
        return { data: l.data, tipo: l.tipo, tipoNome: C.TIPOS[l.tipo] || l.tipo, conta: eua ? 'EUA' : 'BR', moeda: eua ? 'USD' : 'BRL',
            ativo: tem('ativo'), especie: tem('especie'), qtd: tem('qtd'), preco: tem('preco'), custos: tem('custos'), valor: tem('valor'), pctCDI: tem('pctCDI'),
            valorOperacao: l.tipo === 'preco' ? null : r2(bruto), ptax: eua ? r2(fx, 4) : null, valorOperacaoBRL: l.tipo === 'preco' || fx === null ? null : r2(bruto * fx),
            liquidacao: l.liq || null, obs: l.obs || '' };
    });
    // fim de cada mês (e o último dia) a partir da série diária
    const mensal = []; let i0 = s.patrimonio.findIndex(p => p > 1e-9); if (i0 < 0) i0 = 0;
    let ant = null;
    for (let k = i0; k <= n; k++) {
        if (k < n && s.datas[k + 1].slice(0, 7) === s.datas[k].slice(0, 7)) continue;
        const a = ant === null ? i0 : ant;
        const ganho = ant === null ? s.patrimonio[k] - s.aportado[k] : s.patrimonio[k] - s.patrimonio[a] - (s.aportado[k] - s.aportado[a]);
        const nom = s.cota[k] / s.cota[a] - 1, inf = s.ipca[k] / s.ipca[a] - 1;
        mensal.push({ mes: s.datas[k].slice(0, 7), data: s.datas[k], patrimonioBRL: r2(s.patrimonio[k]), aportadoAcumBRL: r2(s.aportado[k]),
            aportesNoMesBRL: r2(ant === null ? s.aportado[k] : s.aportado[k] - s.aportado[a]), ganhoNoMesBRL: r2(ganho), caixaBRL: r2(s.caixa[k]), contaEUA_BRL: r2(s.eua[k]),
            cota: r2(s.cota[k], 6), rentMesPct: pc(nom), rentMesRealPct: pc((1 + nom) / (1 + inf) - 1), ipcaMesPct: pc(inf), cdiMesPct: pc(s.cdi[k] / s.cdi[a] - 1), rentAcumPct: pc(s.cota[k] / s.cota[i0] - 1) });
        ant = k;
    }
    // aportes e retiradas mês a mês (inclui os automáticos: compra sem aporte antes conta como aporte)
    const aportesMes = {};
    const am = (m) => aportesMes[m] || (aportesMes[m] = { mes: m, aportesBR_BRL: 0, retiradasBR_BRL: 0, aportesEUA_USD: 0, retiradasEUA_USD: 0, aportesEUA_BRL: 0, retiradasEUA_BRL: 0 });
    for (const l of lancamentos) {
        if (l.tipo !== 'aporte' && l.tipo !== 'retirada') continue;
        const x = am(l.data.slice(0, 7)), ap = l.tipo === 'aporte';
        if (l.conta === 'EUA') { x[ap ? 'aportesEUA_USD' : 'retiradasEUA_USD'] += l.valor || 0; x[ap ? 'aportesEUA_BRL' : 'retiradasEUA_BRL'] += l.valorOperacaoBRL || 0; }
        else x[ap ? 'aportesBR_BRL' : 'retiradasBR_BRL'] += l.valor || 0;
    }
    for (const m of mensal) if (Math.abs(m.aportesNoMesBRL) > 0.005 || aportesMes[m.mes]) am(m.mes).liquidoNaSerieBRL = m.aportesNoMesBRL;
    const aportes = Object.values(aportesMes).sort((a, b) => a.mes < b.mes ? -1 : 1).map(x => { for (const k in x) if (typeof x[k] === 'number') x[k] = r2(x[k]); return x; });
    const posicoes = R.posicoes.map(p => ({ ativo: p.ativo, nome: p.nome, conta: p.conta || 'BR', classe: p.classe, tipoIR: p.tipoIR, qtd: p.qtd != null ? r2(p.qtd, 8) : null,

let apagarArmado = null;
document.addEventListener('click', (ev) => {

});
document.addEventListener('change', (ev) => {

document.addEventListener('input', (ev) => {
